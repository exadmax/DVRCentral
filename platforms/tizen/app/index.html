<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Central Diogo</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #0B1220; color: #F2F5FA; font-family: sans-serif; overflow: hidden; }
  #msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #msg img { width: 160px; height: 160px; border-radius: 32px; margin-bottom: 32px; }
  #msg h1 { font-size: 44px; margin: 0 0 12px; }
  #msg p { font-size: 26px; margin: 0; opacity: .65; }
  #f { position: fixed; left: 0; top: 0; width: 100%; height: 100%; border: 0; display: none; background: #0B1220; }
</style>
</head>
<body>
  <div id="msg">
    <img src="icon.png" alt="">
    <h1>Central Diogo</h1>
    <p id="t">Conectando ao painel…</p>
  </div>
  <iframe id="f" allow="autoplay; fullscreen"></iframe>

<script>
  // Endereço do painel (hub). Vários endereços podem ser tentados na ordem.
  var HUBS = ['http://192.168.0.10/'];

  var frame = document.getElementById('f'), msg = document.getElementById('msg'), txt = document.getElementById('t');
  var current = null, misses = 0;

  function ping(base, cb) {
    var x = new XMLHttpRequest();
    x.open('GET', base + 'api/health?_=' + Date.now());
    x.timeout = 4000;
    x.onload = function () { cb(x.status === 200); };
    x.onerror = x.ontimeout = function () { cb(false); };
    x.send();
  }

  function pick(i, cb) {                       // primeiro endereço que responder
    if (i >= HUBS.length) return cb(null);
    ping(HUBS[i], function (ok) { ok ? cb(HUBS[i]) : pick(i + 1, cb); });
  }

  function show(base) {
    if (current !== base) { current = base; frame.src = base; }
    frame.style.display = 'block'; msg.style.display = 'none'; misses = 0;
  }

  function offline() {
    current = null; frame.style.display = 'none'; frame.src = 'about:blank';
    msg.style.display = 'flex'; txt.textContent = 'Sem conexão com a Central Diogo. Tentando de novo…';
  }

  function tick() {
    pick(0, function (base) {
      if (base) return show(base);
      if (++misses >= 2 || !current) offline();   // tolera uma falha isolada antes de derrubar o painel
    });
  }

  function exitApp() {
    try { tizen.application.getCurrentApplication().exit(); } catch (e) { /* fora da TV */ }
  }

  // Tecla Voltar (10009) do controle e pedido de saída vindo do painel (dentro do iframe)
  document.addEventListener('keydown', function (e) { if (e.keyCode === 10009) exitApp(); });
  window.addEventListener('message', function (e) { if (e.data === 'cd-exit') exitApp(); });

  // Evita que a TV entre em proteção de tela: é um painel
  try { tizen.power.request('SCREEN', 'SCREEN_NORMAL'); } catch (e) { /* sem permissão/ambiente */ }

  tick();
  setInterval(tick, 10000);
</script>
</body>
</html>
