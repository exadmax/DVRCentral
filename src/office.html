<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LiteOffice Completo</title>
  <link rel="icon" href="assets/img/logo-192.png">
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: #1f2937; color: #e5e7eb; font: 14px/1.4 'Segoe UI', system-ui, sans-serif; }
    #bar { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: #111827; border-bottom: 1px solid #374151; flex: none; }
    #bar b { font-weight: 600; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #bar .sp { flex: 1; }
    #bar .meta { color: #9ca3af; font-size: 12px; }
    #bar button { background: #2563eb; color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
    #bar button:disabled { background: #374151; color: #9ca3af; cursor: default; }
    #stage { position: relative; flex: 1; min-height: 0; background: #fff; }
    /* O Qt exige canvas com id qtcanvas, sem borda e sem padding (senão o mouse erra a posição). */
    #qtcanvas { display: block; width: 100%; height: 100%; border: 0; padding: 0; outline: none; visibility: hidden; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #111827; text-align: center; padding: 20px; }
    #loading .spin { width: 64px; height: 64px; border: 8px solid #374151; border-top-color: #059669; border-radius: 50%; animation: spin 1.4s linear infinite; }
    #loading.err .spin { display: none; }
    #loading.err #msg { color: #fca5a5; }
    #loading small { color: #9ca3af; max-width: 560px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="bar">
    <b id="name">LiteOffice Completo</b><span class="meta" id="state"></span><span class="sp"></span>
    <button id="save" disabled title="Grava no mesmo lugar de onde o arquivo foi aberto (Ctrl+S)">💾 Salvar no Desktop</button>
  </div>
  <div id="stage" onselectstart="event.preventDefault()">
    <canvas id="qtcanvas" contenteditable="true" oncontextmenu="event.preventDefault()" onkeydown="event.preventDefault()"></canvas>
    <div id="loading"><div class="spin"></div><div id="msg">Preparando…</div><small id="hint"></small></div>
  </div>
  <script src="config/settings.example.js"></script>
  <script src="config/settings.js" onerror="void 0"></script>
  <script src="js/office/office.js"></script>
</body>
</html>
